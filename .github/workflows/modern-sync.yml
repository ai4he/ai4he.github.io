# Sync the lab website (served from the repository root) from carlostoxtli.com,
# rebuild it, and redeploy. Runs every Monday and on demand (Actions tab →
# "Sync lab website" → Run workflow). The build never touches old/ (the archived
# original site). Remove the `schedule` block to keep it manual-only.
name: Sync lab website

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * 1"

permissions:
  contents: write
  actions: write

concurrency:
  group: modern-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r _src/requirements.txt

      - name: Sync, build and check
        run: python3 _src/update.py

      - name: Commit changes
        id: commit
        run: |
          if git status --porcelain -- . ':!old' | grep -q .; then
            git config user.name "haie-lab-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A -- . ':!old'
            git commit -m "Sync lab website from carlostoxtli.com"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No changes."
          fi

      # Pushes made with GITHUB_TOKEN do not trigger other workflows, so start
      # the Pages deployment explicitly.
      - name: Redeploy GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run jekyll-gh-pages.yml --ref "${{ github.ref_name }}"
