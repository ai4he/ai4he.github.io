- slug: cecilia-delgado-solorzano
  name: Cecilia Delgado Solorzano
  aliases: [Cecilia Delgado, Cecilia Delgado-Solorzano, Cecilia Delgado-Solórzano, Cecilia Delgado Solórzano, Cecilia Solorzano, C. Delgado Solorzano]
