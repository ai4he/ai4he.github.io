  title: Researcher
  affiliation: Metacognition Institute (U.K.)
  interests: [Metacognition, AI epistemics, LLM calibration, Socratic dialogue, Philosophy of science, Machine consciousness]
  bio: |
    Manuel Delaflor is a researcher in the Human-AI Empowerment Lab and the director and main researcher of the Metacognition Institute (U.K.). An epistemologist and philosopher of science, Manuel began a research career with six years of work alongside Jacobo Grinberg at the National Autonomous University of Mexico (UNAM) and is developing Model Dependent Ontology, an epistemic framework that informs the lab's research on AI epistemics.

    With the lab, Manuel studies sycophantic metacognition and confidence calibration in LLM self-assessment (ACM CUI 2026), the attribution of mental states and consciousness to AI (Frontiers in Psychology, 2026), the ethical consistency of LLMs under perturbation, their logic and fact-checking capabilities, and Socratic-dialogue systems such as Belief Explorer that support reflection on personal beliefs (CHI 2026). Manuel previously developed financial algorithms at Liv Capital and is also an award-winning photographer and digital artist.
  highlights:
    - "Co-author of more than 20 lab publications (2023-2026), including ACM CUI, ACM IVA, HCOMP, AAAI/ACM AIES, CHI and seven NeurIPS 2026 workshops"
    - "Director and Main Researcher, Metacognition Institute (U.K.), since 2023"
