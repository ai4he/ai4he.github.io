- slug: wangfan-li
  name: Wangfan Li
  aliases: [Wangfan Li, W. Li]
  group: phd
  status: current
  title: Ph.D. Student, Human-Centered Computing
  program: Ph.D. in Human-Centered Computing, Clemson University
  since: "Fall 2023"
  expected_graduation: "Fall 2027"
  interests: [Human oversight of AI agents, Supervisory control, Human-centered automation, LLM-assisted writing, Fairness in ML workflows]
  bio: |
    Wangfan Li is a Ph.D. student in Human-Centered Computing at Clemson University, advised by Dr. Carlos Toxtli. Wangfan's research asks how people can remain in meaningful control of increasingly autonomous AI. The work introduced Prompt-Level Supervisory Alignment (PLSA), which turns Supervisory Control Theory, a framework for human oversight of automated systems, into a structured prompting strategy for LLM revision (ACM CAIS 2026) and anticipatory manuscript revision across multiple rounds of peer review (HFES 2026).

    Wangfan's earlier projects built a sandboxed environment for human oversight of autonomous task execution (IEEE CAI 2025), retrieval-augmented human-AI co-authoring of software requirements (ACM SAC 2026), LLM-generated BPMN workflows for robotic process automation, ReActIn, a framework for infusing human feedback into the intermediate reasoning steps of LLMs, and micro-ethics nudges that reduce unfairness in no-code machine-learning tools (AHFE 2026). Wangfan also co-authored the Autonomous Cognitive Entity (ACE) framework and work on AI for situation awareness in augmented reality with Clemson's human factors researchers.
  highlights:
    - "First author at ACM CAIS (inaugural edition), ACM SAC, IEEE CAI, HFES and AHFE"
    - "Presented the lab's work in person at ACM SAC 2026 (Thessaloniki)"
    - "NSF NRT+ Summit trainee (Cleveland State University, 2025)"
  links:
