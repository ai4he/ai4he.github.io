  interests: [AI-mediated communication, Second-language learning, LLM evaluation, Crowdsourcing, Human-autonomy teaming]
  bio: |
    Cecilia Delgado Solorzano is a Ph.D. student in Human-Centered Computing at Clemson University, advised by Dr. Carlos Toxtli. Cecilia's research examines how AI can mediate communication for bilingual and second-language speakers, from participatory design of personal AI assistants for face-to-face conversations (CHI 2026) to AI-supported fluency practice for advanced learners (IEEE CAI 2025) and the effect of AI language tools on crowd workers who complete tasks outside their primary language (IEEE SmartData 2024). With Clemson University Libraries, Cecilia developed LibRef, an LLM-powered assistant for student information seeking that received the Best Paper Award at ACM MexIHC 2024.

    Cecilia also studies the reliability of large language models, including syllogistic reasoning, fact-checking and errors hidden in widely used benchmarks, and contributes to the lab's Navy-funded human-autonomy teaming project, where Cecilia led a study comparing specialized detectors and multimodal models for underwater search and rescue (ICECET 2026). Before Clemson, Cecilia earned an M.Eng. and a B.S. from the Universidad Nacional Autónoma de México (UNAM) and worked as a digital signal processing engineer in UNAM's Biorobotics Laboratory, designing audio recognition algorithms.
  highlights:
