- slug: carlos-toxtli
  name: Carlos Toxtli-Hernández
  aliases: [Carlos Toxtli, Carlos Toxtli Hernandez, Carlos Toxtli-Hernandez, Carlos Toxtli Hernández, Carlos Toxli-Hernandez, Carlos Toxtli-Hernández, C. Toxtli]
  group: director
  status: current
  title: Assistant Professor of Human-Centered Computing · Lab Director
  since: 2022
  interests: [Human-Centered AI, Human-Centered Automation, Future of Work, Agentic AI, Crowdsourcing, Large Language Models]
  bio: |
    Carlos Toxtli-Hernández is an Assistant Professor in the Human-Centered Computing Division of the School of Computing at Clemson University, where he founded and directs the Human-AI Empowerment (HAIE) Lab. His research applies Human-Centered Artificial Intelligence to the design of tools that promote fair and frictionless interactions in the workplace, with a growing focus on how people can supervise, trust and benefit from autonomous and agentic AI systems.

    He is the author of two books with CRC Press / Taylor & Francis, *Human-AI Empowerment: An Interdisciplinary Perspective* (2025) and *Human-Centered Automation* (2026). He leads the NSF AIMing project on AI-assisted mathematical discovery and is co-investigator on research funded by NSF, NASA, the U.S. Navy and the U.S. Army. His work on the invisible labor of crowd workers received an Impact Award at ACM CSCW 2021, and his AI-for-good framework for digital workers was selected among UNESCO IRCAI's Global Top 100 projects.

    Before Clemson, he earned his Ph.D. in Computer Science at Northeastern University and worked at the United Nations, Google, Microsoft Research and Snap Inc., and was an Amazon Twitch Research Fellow. He serves the HCI community as an Associate Chair for ACM CHI (2025, 2026), Senior Program Committee member for ACM CHIWORK 2026 and NSF review panelist, and has given more than a hundred talks worldwide.
  highlights:
    - "Author of two single-authored books with CRC Press / Taylor & Francis (2025, 2026)"
    - "Lead PI, NSF AIMing: Interactive Conjecture Proving"
    - "Impact Award, ACM CSCW 2021"
    - "UNESCO IRCAI Global Top 100 promising AI projects (2022)"
    - "Associate Chair, ACM CHI 2025 and CHI 2026"
    - "U.S. Patent US12093703B2 and a published patent application on intelligent document collaboration (with Microsoft Research)"
  honors:
