  program: Ph.D. in Computer Science, Clemson University
  since: "Fall 2025"
  interests: [Reliability and robustness of AI, LLMs and mathematical reasoning, Retrieval-augmented reasoning, Worker-centered AI, Scalable machine learning]
  bio: |
    Fateme Mazdarani is a second-year Ph.D. student in Computer Science at Clemson University, working in the Human-AI Empowerment Lab under the supervision of Dr. Carlos Toxtli. Fateme's research focuses on the reliability, robustness and interpretability of AI systems, especially how large language models access, evaluate and verify mathematical knowledge across equivalent representations and how retrieval can support more reliable reasoning. This work includes the TREAT benchmark for recognizing theorems under equivalent mathematical forms (SYNASC 2026), robust procedural mathematical reasoning (MathNLP 2026 at EMNLP), step-level verification of non-canonical solutions (IEEE ICMLA 2026) and a measure of mathematical creativity in formal proof generation (MATH-AI at NeurIPS 2026).

    Fateme also led a study showing that transparent, explained task recommendations raise crowd workers' perceived fairness, trust and empowerment (IEEE CAI 2026), developed randomized SVD methods for spectral co-clustering of text, and contributes to the lab's Navy-funded research on autonomous underwater vehicle navigation with vision-language-action models. Fateme holds a B.Sc. in Computer Engineering from the University of Tehran and received the Dr. Robert M. Geist III Endowed Fellowship in Computing.
  highlights:
