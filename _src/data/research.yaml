# ---------------------------------------------------------------------------
# Research thrusts
# ---------------------------------------------------------------------------
# Each thrust gets a page at research/<slug>/ listing its projects and papers.
# Publications are assigned to thrusts by `overrides.yaml` (explicit) or, for
# new papers, automatically when their title/abstract matches `keywords`.
# `color` is one of: violet, cyan, amber, blue, coral, green (a colorblind-
