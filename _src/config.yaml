# --------------------------------------------------------------------------
# HAIE Lab website, global configuration
# --------------------------------------------------------------------------
# Edit this file for site-wide settings. Content lives in data/*.yaml.

site:
  name: "Human-AI Empowerment Lab"
  short_name: "HAIE Lab"
  tagline: "Designing AI that expands what people can achieve."
  description: >-
    The Human-AI Empowerment (HAIE) Lab at Clemson University studies how
    artificial intelligence, increasingly autonomous and agentic, can empower
    people at work, in science, and in society.
  # Public base URL of the site (used for canonical links, sitemaps and
  # social cards). The site is served from the root of the domain.
  base_url: "https://haielab.org"
  email: "hello@haielab.org"
  address:
    - "School of Computing, Human-Centered Computing Division"
    - "McAdams Hall, Clemson University"
    - "Clemson, SC 29634, USA"
  university: "Clemson University"
  university_url: "https://www.clemson.edu"
  school: "School of Computing"
  school_url: "https://www.clemson.edu/cecas/departments/computing/"
  department: "Human-Centered Computing"
  department_url: "https://www.clemson.edu/cecas/departments/computing/academics/divisions/hcc.html"
  founded: "August 2022"
  github: "https://github.com/ai4he"

# The personal website renders this published Google Doc; it is the single
# source of truth for publications, talks, grants, patents and service.
source:
  personal_site: "https://www.carlostoxtli.com"
  google_doc_url: "https://docs.google.com/document/d/e/2PACX-1vRHNwLVVLO8rNZVzNOos8r1bav8k2CDDkv1wXrz7hS5XTvrShOpoq3R1axgGUR7MShB0M90t3OKczKD/pub"
  # Everything from this date onward belongs to the lab. Earlier items are
  # the director's prior work and are not listed as lab output.
  lab_start: { year: 2022, month: 8 }

# Navigation (label, path)
nav:
  - ["Research", "research/"]
  - ["Projects", "projects/"]
  - ["Publications", "publications/"]
  - ["People", "people/"]
  - ["Funding", "funding/"]
  - ["News", "news/"]
  - ["Join", "join/"]

