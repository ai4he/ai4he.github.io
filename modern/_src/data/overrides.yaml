# ---------------------------------------------------------------------------
# Corrections and enrichment on top of the synced data (data/auto/*.json)
# ---------------------------------------------------------------------------
# Publications are matched by a case-insensitive fragment of their title, so
# entries survive edits to the BibTeX keys in the Google Doc.
#
# Publication fields you can set:
#   areas        research thrust slugs; the first one is the primary thrust
#   featured     true -> shown in "Selected publications" on the home page
#   type         book | chapter | journal | conference | workshop | poster | abstract | preprint
#   venue_short  short venue label, e.g. "CHI 2026"
#   track        small badge, e.g. "Extended Abstract", "Demo", "Workshop"
#   doi / url    override links
#   links        extra links {Code: ..., Video: ..., Slides: ..., Demo: ...}
#   award        e.g. "Best Paper Award"
#   image        teaser image file in assets/img/papers/ (else generated art)
#   include      true to force-include an item dated before the lab started
#   exclude      true to hide an item
# ---------------------------------------------------------------------------

publications:
