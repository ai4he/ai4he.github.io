# ---------------------------------------------------------------------------
# Sponsor and partner logos
# ---------------------------------------------------------------------------
# Files live in modern/assets/img/logos/. Each organization is matched by
# `match` against a grant's `sponsor_short` / `sponsor` (funding.yaml) and a
# collaborator's `name` (collaborators.yaml); a match is exact or a prefix.
# `label` is the caption under the logo. Logos sit on white tiles in both
# themes, so use the full-color version meant for light backgrounds.
# The build lists sponsors and partners that still have no logo.
#
# Sources: Wikimedia Commons (public-domain logos) and each organization's
# own website or brand site, October 2026.
# ---------------------------------------------------------------------------

# ------------------------------- Sponsors ---------------------------------
- file: nsf.svg
  label: National Science Foundation
  match: [NSF, National Science Foundation]
  url: https://www.nsf.gov/

- file: nasa.svg
  label: NASA
  match: [NASA, National Aeronautics and Space Administration]
  url: https://www.nasa.gov/

- file: onr.png
  label: Office of Naval Research
  match: [U.S. Navy, U.S. Department of the Navy, Office of Naval Research]
  url: https://www.nre.navy.mil/

- file: us-army.svg
  label: U.S. Army DEVCOM GVSC
  match: [U.S. Army]
  url: https://gvsc.devcom.army.mil/

- file: srnl.svg
  label: Savannah River National Laboratory
  match: [SRNL, Savannah River National Laboratory, Clemson University and Savannah River National Laboratory]
  url: https://www.srnl.gov/

