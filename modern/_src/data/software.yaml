- name: Fermi-LLM
  kind: Platform
  url: https://github.com/ai4he/fermi-llm-int
  project: fermi-llm
  description: >-
    A web platform that turns a plain-English request into a real Fermi-LAT
    gamma-ray analysis: it writes the FermiPy configuration and Python driver,
    checks them, runs exactly what the scientist approves and shows every step.
    Every model, rule, validator and data source is a pluggable module.
  tags: [LLM agents, Astrophysics, Python]

- name: Trust-Calibration Benchmark
  kind: Benchmark & artifact
  url: https://github.com/ai4he/qualification-by-calibration
  paper: Qualification by Calibration
  project: metacognitive-ai
  description: >-
    A small, auditable qualification test for language models used as workers
    in human-computation pipelines: 60 yes/no items across five domains with
    independently audited gold labels, plus the evaluation harness.
  tags: [Benchmark, Calibration, HCOMP 2026]

- name: Sycophantic Metacognition
  kind: Code & data
  url: https://github.com/ai4he/kruger
  paper: Sycophantic Metacognition
  project: metacognitive-ai
  description: >-
    Complete code, data, prompts, results and analysis pipeline for the
    multi-phase study of metacognitive calibration and sycophancy in LLM
    self-assessment.
  tags: [Reproducibility, LLM evaluation, CUI 2026]

- name: Belief Explorer
  kind: Research system
  url: https://github.com/ai4he/belief-explorer
  paper: Belief Explorer
  project: metacognitive-ai
  description: >-
    An AI system that uses Socratic dialogue and multi-perspective analysis to
    help people examine personally held beliefs.
  tags: [Socratic dialogue, Epistemic reflection, CHI 2026]

- name: CultureFit
