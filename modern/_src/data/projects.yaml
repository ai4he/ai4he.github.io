- slug: workplace-assistants
  title: AI Assistants and Self-Quantification at Work
  short: Privacy-preserving activity sensing and LLM coaching for knowledge workers.
  status: completed
  years: "2023–2024"
  areas: [future-of-work, human-centered-automation]
  people: [carlos-toxtli, ravindu-perera, wangfan-li, claire-gendron, cecilia-delgado-solorzano, alberto-campos-hernandez, victor-rios-munoz, matthew-rogers, adithya-ravi]
  description: |
    Knowledge workers want to understand how they spend their time, but most tracking tools are not goal-oriented and keep raw data from users and researchers. This project built a family of research frameworks for studying AI assistance in the workplace.

    Wellbot tracks computer activity, distinguishes goal-oriented from recreational time and generates LLM-aided recommendations toward users' goals (MexIHC 2024). SmartMonitor passes a computer's HDMI signal through an edge device that analyzes activity on-device and sends only logs to an LLM for feedback, protecting privacy and reducing load on the user's machine. VirtuaScreens explores AI-enhanced arrangements of virtual monitors in extended-reality workspaces, and a companion study assessed the task decomposition, scheduling, delegation and execution capabilities of LLM-powered agents. Four of these systems were presented as demos at ACM CHIWORK 2024.
  papers:
    - "AI Assistants in the Workplace"
    - "SmartMonitor"
    - "Multi-Screen Interaction in Extended Reality"
    - "Task Management Capabilities of LLM-Powered Agents"
    - "Leveraging Artificial Intelligence to Promote Awareness in Augmented Reality"
  links:
    "Code: SmartMonitor": https://github.com/ai4he/Hardware_Application
    "Code: VirtuaScreens": https://github.com/ai4he/VirtuaScreens

- slug: water-ai
  title: AI for Water and Agriculture
  short: Physics-informed and reinforcement learning for irrigation and floods.
  status: active
  years: "2024–present"
  areas: [ai-for-science]
  people: [carlos-toxtli, krishna-panthi, sai-praneeth-dulam]
  collaborators:
    - "Vidya Samadi (Clemson University)"
    - "David Werth (Savannah River National Laboratory)"
  funding: [srnl-water]
  description: |
    Cotton irrigation in the southeastern United States draws heavily on freshwater, and current scheduling relies on sensors and grower experience. With Dr. Vidya Samadi's hydroinformatics group, the lab develops learning systems that account for soil, weather and crop growth stage.

    M.S. student Krishna Panthi coupled the 1-D Richards equation with FAO AquaCrop to model soil-water dynamics, validated against field data (Irrigation and Drainage, 2026), and used the crop model as an environment for deep reinforcement learning of irrigation strategies. Related work applies convolutional and transformer vision models to images from USGS river cameras for flood monitoring, and a Savannah River National Laboratory award supports physics-informed deep learning for water quantity and quality across the Savannah River Basin.
  papers:
    - "Coupled AquaCrop"
    - "Optimizing Irrigation"
    - "Flood Image Processing"

