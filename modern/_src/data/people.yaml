- slug: cecilia-delgado-solorzano
  name: Cecilia Delgado Solorzano
  aliases: [Cecilia Delgado, Cecilia Delgado-Solorzano, Cecilia Delgado-Solórzano, Cecilia Delgado Solórzano, Cecilia Solorzano, C. Delgado Solorzano]
  group: phd
  status: current
  title: Ph.D. Student, Human-Centered Computing
  program: Ph.D. in Human-Centered Computing, Clemson University
  since: "Fall 2022"
  expected_graduation: "Summer 2027"
  interests: [AI-mediated communication, Second-language learning, LLM evaluation, Crowdsourcing, Human-autonomy teaming]
  bio: |  # draft
    Cecilia Delgado Solorzano is a Ph.D. student in Human-Centered Computing advised by Dr. Carlos Toxtli. Cecilia's research examines how AI can mediate communication for bilingual and second-language speakers, from participatory design of personal AI assistants for face-to-face conversations (CHI 2026) to AI-supported fluency practice (IEEE CAI 2025) and the effect of AI language tools on crowd workers who complete tasks outside their primary language (IEEE SmartData 2024).

    Cecilia also studies the reliability of large language models — their syllogistic reasoning and fact-checking, and the detection of errors in widely used benchmarks — and contributes to the lab's Navy-funded research on human-autonomy teaming, where Cecilia first-authored a study comparing specialized detectors and multimodal models for underwater search and rescue (ICECET 2026).
  highlights:
    - "First author of papers at ACM CHI (EA), IEEE CAI, IEEE SmartData, ICECET and AHFE"
    - "Co-author of a book chapter on AI-driven tools for crowdwork (IntechOpen, 2026)"
    - "NSF NRT+ Summit trainee (Cleveland State University, 2025)"
  links: {}

- slug: wangfan-li
  name: Wangfan Li
  aliases: [Wangfan Li, W. Li]
  group: phd
  status: current
  title: Ph.D. Student, Human-Centered Computing
  program: Ph.D. in Human-Centered Computing, Clemson University
  since: "Fall 2023"
  expected_graduation: "Fall 2027"
  interests: [Human oversight of AI agents, Supervisory control, Human-centered automation, LLM-assisted writing, Fairness in ML workflows]
  bio: |  # draft
    Wangfan Li is a Ph.D. student in Human-Centered Computing advised by Dr. Carlos Toxtli. Wangfan's research asks how people can remain in meaningful control of increasingly autonomous AI. The work introduced Prompt-Level Supervisory Alignment (PLSA), which turns Supervisory Control Theory — a framework for human oversight of automated systems — into a structured prompting strategy for LLM revision (ACM CAIS 2026) and anticipatory manuscript revision (HFES 2026).

    Wangfan's earlier projects built a sandboxed environment for human oversight of autonomous task execution (IEEE CAI 2025), retrieval-augmented human–AI co-authoring of software requirements (ACM SAC 2026), LLM-generated BPMN workflows for robotic process automation, and micro-ethics nudges that reduce unfairness in no-code machine-learning tools.
  highlights:
    - "First author at ACM CAIS (inaugural edition), ACM SAC, IEEE CAI and HFES"
    - "Presented the lab's work in person at ACM SAC 2026 (Thessaloniki)"
    - "NSF NRT+ Summit trainee (Cleveland State University, 2025)"
  links: {}

- slug: austin-lahue
  name: Austin LaHue
  aliases: [Austin LaHue, A. LaHue]
  group: phd
  status: current
  title: Ph.D. Student, Human-Centered Computing
  program: Ph.D. in Human-Centered Computing, Clemson University
  since: "Fall 2025"
  interests: [AI for mathematics, Conjecture generation, Premise retrieval, Human-AI scientific discovery]
  bio: |  # draft
    Austin LaHue is a Ph.D. student in Human-Centered Computing and the graduate research assistant of the NSF AIMing project (Interactive Conjecture Proving), advised by Dr. Carlos Toxtli. Austin studies how language models can support research-level mathematics: which forms of mathematical context help a model generate the conjecture a paper actually proves, and how retrieval systems can surface the premise needed for the next step of a natural-language proof. Austin first-authored a paired ablation study of context for target-aligned conjecture generation and co-authored the NaturalPRISM benchmark, both at MathNLP 2026 (EMNLP).
  links: {}

- slug: fateme-mazdarani
  name: Fateme Mazdarani
  aliases: [Fateme Mazdarani, F. Mazdarani]
  group: phd
  status: current
  title: Ph.D. Student, Computer Science
  program: Ph.D. in Computer Science, Clemson University
  since: "Fall 2025"
  interests: [Mathematical reasoning in LLMs, Robust evaluation, Worker-centered AI, Explainable recommendation]
  bio: |  # draft
    Fateme Mazdarani is a Ph.D. student in Computer Science advised by Dr. Carlos Toxtli. Fateme's research evaluates whether language models reason robustly when the same mathematics is expressed in different forms — recognizing theorems under equivalence-preserving transformations (TREAT, SYNASC 2026), reconstructing procedural routes between representations (MathNLP 2026) and verifying non-canonical step-by-step solutions (IEEE ICMLA 2026).

    Fateme also led a study of transparent, explained task recommendations in crowd work, showing that lightweight disclosure increased workers' perceived fairness, trust and empowerment (IEEE CAI 2026), and serves as teaching assistant for the lab's online Human-Centered AI course.
  highlights:
    - "First author of five 2026 papers (IEEE CAI, IEEE ICMLA, SYNASC, MathNLP at EMNLP, arXiv)"
  links: {}

