# ---------------------------------------------------------------------------
# Teaching
# ---------------------------------------------------------------------------
philosophy: |
  Teaching in the HAIE Lab combines experiential and curiosity-driven learning. In Applied Data Science, students work on real-world projects brought by research and industry partners. In Human-Centered AI, every slide links to further readings so students can follow their interests, and weekly reports connect course principles to each student's own project. Course projects are designed to end in a portfolio-ready public artifact, and several have become publications with students as co-authors.

courses:
  - code: "HCC 4600/6600"
    title: Human-Centered AI
    terms: "Spring 2025, Spring 2026 (on campus); Spring 2025, Fall 2025, Spring 2026, Fall 2026 (Coursera online)"
    note: "Course created by Dr. Toxtli in 2023; its Coursera edition, also authored by Dr. Toxtli, has run every semester since Spring 2025."
    description: >-
      Designing AI systems around people. The course is built around hands-on
      in-class activities, discussions, guest speakers and portfolio-ready
      deliverables, and is updated each year with findings from the lab's
      active grants and current AI-enabled practices.
  - code: "CPSC 4820/6820"
    title: Human-Centered AI
    terms: "Fall 2023"
    note: "New course developed in 2023."
    description: >-
      The first offering of the lab's Human-Centered AI course in the
      School of Computing.
  - code: "CPSC 4300/6300"
    title: Applied Data Science
    terms: "Spring 2023, Spring 2024, Fall 2024, Fall 2025"
    description: >-
      Experiential data science: students apply course methods to real-world
      projects proposed by researchers and partners.
  - code: "CPSC 2120"
    title: Algorithms and Data Structures
    terms: "Fall 2022"
    description: >-
      Fundamental data structures and algorithms and their analysis.

mentoring:
